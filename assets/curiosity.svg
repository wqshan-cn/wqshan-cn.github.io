    <circle cx="124" cy="164" r="3" fill="#b34b37" stroke="none"/>
    <path d="M484 372H435V337H410"/>
    <circle cx="410" cy="337" r="3" fill="#b34b37" stroke="none"/>
    <path d="M136 423H93V387"/>
    <circle cx="93" cy="387" r="3" fill="#667f5c" stroke="none"/>
  </g>

