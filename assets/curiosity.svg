      <circle cx="31" cy="-114" r="2.4"/><circle cx="87" cy="-79" r="2.9"/><circle cx="119" cy="-27" r="2.5"/>
      <circle cx="125" cy="30" r="3"/><circle cx="101" cy="76" r="2.6"/><circle cx="57" cy="108" r="2.8"/>
      <circle cx="3" cy="124" r="2.5"/><circle cx="-57" cy="111" r="2.9"/><circle cx="-102" cy="75" r="2.5"/>
      <circle cx="-126" cy="23" r="2.8"/>
