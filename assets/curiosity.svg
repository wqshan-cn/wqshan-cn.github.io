  <g transform="translate(354 338) rotate(27) scale(.67)" stroke="#bd624d" fill="none">
    <use href="#organic-ring" transform="scale(1.03)" opacity=".42"/>
    <use href="#organic-ring" transform="scale(.94)" opacity=".47"/>
    <use href="#organic-ring" transform="scale(.85)" opacity=".52"/>
    <use href="#organic-ring" transform="scale(.76)" opacity=".57"/>
