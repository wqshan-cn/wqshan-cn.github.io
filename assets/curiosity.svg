  <g transform="translate(228 226) rotate(-15)" stroke="#536f50" fill="none">
    <use href="#organic-ring" transform="scale(1.04)" opacity=".34"/>
    <use href="#organic-ring" transform="scale(.99)" opacity=".38"/>
