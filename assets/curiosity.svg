      <circle cx="31" cy="-5" r="1.7"/><circle cx="43" cy="20" r="2.8"/><circle cx="23" cy="39" r="1.9"/>
      <circle cx="4" cy="53" r="2.5"/><circle cx="-21" cy="42" r="1.7"/><circle cx="-40" cy="29" r="2.6"/>
      <circle cx="-15" cy="11" r="2.2"/><circle cx="10" cy="10" r="1.7"/><circle cx="24" cy="24" r="2.2"/>
      <circle cx="-5" cy="31" r="1.9"/>
