<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 510" fill="none">
  <title>Life, data and curiosity — conceptual illustration</title>
  <desc>Three organic cell forms orbit a small code card, connecting medicine, code and curiosity.</desc>
  <defs>
    <pattern id="dot-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r=".75" fill="#70806a" opacity=".18"/>
    </pattern>
    <radialGradient id="field-wash">
      <stop stop-color="#d7dfcc" stop-opacity=".42"/>
      <stop offset=".72" stop-color="#eef0e5" stop-opacity=".12"/>
      <stop offset="1" stop-color="#f5f3eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green-core">
      <stop stop-color="#d7dfca" stop-opacity=".84"/>
      <stop offset="1" stop-color="#eef0e5" stop-opacity=".38"/>
    </radialGradient>
    <radialGradient id="red-core">
      <stop stop-color="#ead4ca" stop-opacity=".8"/>
      <stop offset="1" stop-color="#f3e8df" stop-opacity=".3"/>
    </radialGradient>
    <filter id="paper-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#31463a" flood-opacity=".1"/>
    </filter>
    <path id="organic-ring" d="M0-112C52-120 112-86 126-27C141 36 96 104 29 119C-39 134-111 96-126 31C-142-37-102-104-39-119C-25-122-12-118 0-112Z"/>
  </defs>

  <rect x="10" y="8" width="500" height="480" fill="url(#dot-grid)"/>
  <ellipse cx="255" cy="247" rx="224" ry="206" fill="url(#field-wash)"/>

  <g stroke="#93a287" stroke-width=".8">
    <path d="M22 35h18m-9-9v18M480 35h18m-9-9v18M22 466h18m-9-9v18M480 466h18m-9-9v18"/>
    <path d="M93 338C133 425 295 464 405 388C503 320 486 151 374 91C272 35 113 94 72 215" stroke-dasharray="3 8" opacity=".8"/>
    <path d="M86 325C57 228 106 121 204 81" opacity=".42"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="2" fill="#687665">
    <text x="280" y="64">OBSERVE · QUESTION · BUILD</text>
    <text x="35" y="101">01 / MEDICINE</text>
    <text x="407" y="388">02 / CODE</text>
    <text x="142" y="440">03 / CURIOSITY</text>
  </g>

  <g stroke="#87977f" stroke-width=".9">
