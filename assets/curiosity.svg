      <circle cx="-26" cy="42" r="2.8"/><circle cx="-39" cy="21" r="2.2"/><circle cx="-6" cy="16" r="2.7"/>
      <circle cx="18" cy="17" r="2.1"/>
    </g>
    <g fill="#f5f3eb" stroke="#bd624d" stroke-width="1.2">
      <circle cx="-107" cy="-58" r="4"/><circle cx="-63" cy="-105" r="3.8"/><circle cx="-6" cy="-122" r="4"/>
      <circle cx="52" cy="-104" r="3.8"/><circle cx="99" cy="-65" r="4"/><circle cx="124" cy="-10" r="3.8"/>
      <circle cx="109" cy="61" r="4"/><circle cx="55" cy="108" r="3.8"/><circle cx="-7" cy="123" r="4"/>
      <circle cx="-70" cy="102" r="3.8"/><circle cx="-114" cy="53" r="4"/>
    </g>
  </g>

  <g transform="translate(101 355) rotate(-28) scale(.37)" stroke="#728163" fill="none">
    <use href="#organic-ring" transform="scale(1.03)" opacity=".5"/>
    <use href="#organic-ring" transform="scale(.87)" opacity=".56"/>
    <use href="#organic-ring" transform="scale(.71)" opacity=".62"/>
    <use href="#organic-ring" transform="scale(.55)" opacity=".68"/>
    <path d="M-42-25C-17-42 23-37 43-10C60 15 48 52 18 63C-16 76-51 55-57 25C-61 5-54-10-42-25Z" fill="url(#green-core)"/>
    <g fill="#708365" stroke="none" opacity=".58">
