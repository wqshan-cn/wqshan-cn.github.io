    <circle cx="468" cy="245" r="3.5" fill="#718662"/>
    <circle cx="162" cy="395" r="3.5" fill="#b94e3a"/>
    <path d="M462 250h20m-10-10v20M43 278h19m-9.5-9.5v19" stroke="#b94e3a" stroke-width="1.6"/>
